<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Startup Landing Page</title>
  <meta name="description" content="Create your Startup account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>
  <header class="navbar-header">
    <div class="navbar-container">
      <nav class="navbar" id="navbar">
        <a href="index.html#home" class="brand-text">Startup</a>
        <ul class="nav-links">
          <li><a href="index.html#home">Home</a></li>
          <li><a href="index.html#about">About Us</a></li>
          <li><a href="index.html#contact">Contact Us</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="main-container">
    <main>
      <section class="login-section">
        <div class="login-card">
          <h1 class="login-heading">Sign Up</h1>
          <form class="login-form" action="#" method="POST"
            onsubmit="window.location.href='index.html#home'; return false;">
            <div class="form-group">
              <input type="text" id="name" name="name" placeholder="Name" aria-label="Name" class="custom-input"
                required>
            </div>
            <div class="form-group">
              <input type="email" id="email" name="email" placeholder="Email" aria-label="Email" class="custom-input"
                required>
            </div>
            <div class="form-group">
              <input type="password" id="password" name="password" placeholder="Password" aria-label="Password"
                class="custom-input" required>
            </div>
            <div class="form-group">
              <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm Password"
                aria-label="Confirm Password" class="custom-input" required>
            </div>
            <div class="submit-btn-wrapper">
              <button type="submit" class="btn yellow-btn submit-btn">Sign Up</button>
            </div>
          </form>
          <div class="login-footer-links">
            <p class="signup-text">Already have an account? <a href="login.html" class="signup-link">Login</a></p>
            <a href="index.html#home" class="back-home-link">&larr; Back to Home</a>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>

</html>
